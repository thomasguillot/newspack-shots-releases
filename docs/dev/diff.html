<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shots-web.js fidelity harness</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 24px; background: #111; color: #eee; }
  h2 { margin-top: 32px; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; }
  .row figure { margin: 0; }
  .row img, .row canvas { max-width: 420px; height: auto; border: 1px solid #444; }
  figcaption { font-size: 12px; color: #aaa; margin-top: 4px; }
  pre { background: #222; padding: 12px; border-radius: 6px; overflow-x: auto; }
  .pass { color: #26D07C; }
  .fail { color: #ff6b6b; }
</style>
</head>
<body>
<h1>shots-web.js fidelity harness</h1>
<div id="out"></div>
<script type="module">
import { styleImage, composeGrid } from "../assets/shots-web.js";

const out = document.getElementById("out");

async function fetchBlob(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`fetch ${url}: ${r.status}`);
  return r.blob();
}

function pixels(bitmap) {
  const c = document.createElement("canvas");
  c.width = bitmap.width; c.height = bitmap.height;
  const ctx = c.getContext("2d", { willReadFrequently: true });
  ctx.drawImage(bitmap, 0, 0);
  return ctx.getImageData(0, 0, c.width, c.height);
}

async function report(name, actualBlob, refUrl) {
  const section = document.createElement("section");
  section.innerHTML = `<h2>${name}</h2>`;
  out.append(section);
  const [actual, ref] = await Promise.all([
    createImageBitmap(actualBlob),
    createImageBitmap(await fetchBlob(refUrl))
  ]);
  const pre = document.createElement("pre");
  if (actual.width !== ref.width || actual.height !== ref.height) {
    pre.innerHTML = `<span class="fail">SIZE MISMATCH</span> ours ${actual.width}×${actual.height} vs app ${ref.width}×${ref.height}`;
    section.append(pre);
    return;
  }
  const a = pixels(actual), r = pixels(ref);
  const diff = new ImageData(actual.width, actual.height);
  let maxD = 0, sum = 0, n = 0, offenders = 0;
  for (let i = 0; i < a.data.length; i += 4) {
    const d = Math.max(
      Math.abs(a.data[i] - r.data[i]),
      Math.abs(a.data[i + 1] - r.data[i + 1]),
      Math.abs(a.data[i + 2] - r.data[i + 2]));
    maxD = Math.max(maxD, d);
    sum += d; n++;
    if (d > 2) offenders++;
    const heat = Math.min(255, d * 8);
    diff.data[i] = heat; diff.data[i + 1] = 0; diff.data[i + 2] = 0; diff.data[i + 3] = 255;
  }
  const pct = ((offenders / n) * 100).toFixed(3);
  const cls = maxD <= 2 ? "pass" : "fail";
  pre.innerHTML = `size ${actual.width}×${actual.height} <span class="${cls}">max Δ ${maxD}</span>  mean Δ ${(sum / n).toFixed(3)}  pixels over Δ2: ${pct}%`;
  const dc = document.createElement("canvas");
  dc.width = actual.width; dc.height = actual.height;
  dc.getContext("2d").putImageData(diff, 0, 0);
  const row = document.createElement("div");
  row.className = "row";
  for (const [label, el] of [["ours", await blobImg(actualBlob)], ["app", await urlImg(refUrl)], ["diff ×8", dc]]) {
    const fig = document.createElement("figure");
    fig.append(el);
    const cap = document.createElement("figcaption");
    cap.textContent = label;
    fig.append(cap);
    row.append(fig);
  }
  section.append(pre, row);
}

async function blobImg(blob) {
  const img = new Image();
  img.src = URL.createObjectURL(blob);
  await img.decode();
  return img;
}
async function urlImg(url) {
  const img = new Image();
  img.src = url;
  await img.decode();
  return img;
}

const rawA = await fetchBlob("fixtures/raw-a.png");
const rawB = await fetchBlob("fixtures/raw-b.png");
await report("styleImage (even padding, @1x)", await styleImage(rawA, { scale: 1 }), "fixtures/ref-styled.png");
await report("composeGrid (2 tiles, 2 columns, @1x)", await composeGrid([rawA, rawB], { scale: 1, columns: 2 }), "fixtures/ref-grid.png");
</script>
</body>
</html>
